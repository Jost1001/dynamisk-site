<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Valgt produkt</title>
</head>

<body>
    <header>
        <nav>
            <div><a href="/index.html"><img class="logo" src="img/selfdrawn-logo.jpg" alt="logo"></a></div>
            <div>
                <p class="header-link"><a href="/productlist.html">Produkter</a></p>
            </div>
        </nav>
        <h1></h1>

    </header>
    <main>
        <div class="single_product">
            <img src="/img/three.jpg" alt="produkt">
            <div class="product_information">
                <h2>Information om produktet</h2>
                <h4>Artikelnavn</h4>
                <p>Skjorte med gylden soludskæring</p>
                <h4>Farve</h4>
                <p>Hvid og guld</p>
                <h4>Artikelnummer</h4>
                <p>19684</p>
            </div>
            <div class="buy-box">
                <h2 class="buy">Køb</h2>
                <h3>Pris</h3>
                <div>
                    <p class="after">259 kr</p>
                    <p class="before">379 kr - 32%</p>
                </div>
                <form action="">
                    <label for="size">Størrelse:</label>
                    <select name="size" id="sizes">
                        <option value="xx-small">XXS</option>
                        <option value="x-small">XS</option>
                        <option value="small">S</option>
                        <option value="medium">M</option>
                        <option value="large">L</option>
                        <option value="x-large">XL</option>
                        <option value="xx-large">2XL</option>
                    </select>
                </form>
                <button>
                    <p>Læg i kurv</p>
                </button>
            </div>

        </div>
    </main>
    <footer>
        <p>Og hér!</p>

    </footer>

</body>

</html>
