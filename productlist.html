<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="productlist.js" defer></script>
    <title>Produkter</title>
</head>

<body>

    <header>
        <nav>
            <div><a href="index.html"><img class="logo" src="img/selfdrawn-logo.jpg" alt="logo"></a></div>
            <div>
                <p class="header-link"><a href="productlist.html">Produkter</a></p>
            </div>
        </nav>

    </header>
    <main>
        <div class="list_button back_button">Go back</div>

        <section class="filter-og-sorter">
            <div>
                <div class="gender">
                    <summary>Gender</summary>
                    <div data-filter="All" class="list_button">All</div>
                    <div data-filter="Unisex" class="list_button">Unisex</div>
                    <div data-filter="Women" class="list_button">Women</div>
                    <div data-filter="Men" class="list_button">Men</div>
                </div>
                <div class="discount-class">
                    <summary>Discount</summary>
                    <div data-discount="All" class="list_button">All</div>
                    <div data-discount="No-discount" class="list_button">Full price</div>
                    <div data-discount="Discount" class="list_button">Discount</div>
                </div>
                <div class="toj_season">
                    <summary>Season</summary>
                    <div data-season="Fall" class="list_button">Fall</div>
                    <div data-season="Winter" class="list_button">Winter</div>
                    <div data-season="Summer" class="list_button">Summer</div>
                    <div data-season="Spring" class="list_button">Spring</div>
                </div>
                <div class="toj_category">
                    <summary>Category</summary>
                    <div data-category="Accessories" class="list_button">Accessories</div>
                    <div data-category="Apparel" class="list_button">Apparel</div>
                    <div data-category="Footwear" class="list_button">Footwear</div>
                    <div data-category="Free Items" class="list_button">Free Items</div>
                    <div data-category="Personal Care" class="list_button">Personal Care</div>
                    <div data-category="Sporting Goods" class="list_button">Sporting Goods</div>
                </div>

                <div class="sorter_product">
                    <summary>Sort by</summary>
                    <div class="list_button sort_button">Low to high</div>
                    <div class="list_button sort_button">High to low
                    </div>

                </div>

            </div>
        </section>
        <h2>Produkter</h2>
        <p>Her er en masse produkter</p>

        <div class="card_container"></div>
    </main>
    <footer>
        <p>Det samme gælder hér</p>

    </footer>

</body>

</html>
